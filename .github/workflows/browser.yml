name: Gerçek motor ve paket (elle)
on:
  workflow_dispatch:
    inputs:
      with_qwen:
        description: Deneysel Qwen dosyalarını da indir (ek 483 MB; kalite garantisi yok)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Varlıkları hazırla
        shell: bash
        env:
          WITH_QWEN: ${{ inputs.with_qwen }}
        run: |
          if [ "$WITH_QWEN" = "true" ]; then
            npm run assets:install -- --with-qwen
          else
            npm run assets:install
          fi
      - run: npm run test:assets
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mangaflow-package-and-test-results
          if-no-files-found: warn
          retention-days: 7
          path: |
            dist/*.zip
            dist/*.sha256
            tools/*-results.json
